name: famdaily
description: "A family check-in app."
publish_to: 'none'

# build-name / build-number 与 iOS CFBundleShortVersionString、Android versionName 对应。
version: 0.1.0+1

environment:
  # 与 docs/tech-stack.zh_CN.md §8 决策 1 一致：最低 Flutter 3.44.0 / Dart 3.12
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^3.4.3

  # 路由（通知深链）
  go_router: ^18.1.1

  # 本地数据库：Drift + SQLite（Isar 已排除，见 tech-stack §2.2）
  drift: ^2.34.0
  drift_flutter: ^0.3.1
  # 注意：不要直接依赖 sqlite3 / sqlite3_flutter_libs，版本由 drift_flutter 决定
  # （sqlite3_flutter_libs 已标 +eol，见 tech-stack §2.2）

  # 提醒
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  # 不可变模型
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # 基础设施
  path: ^1.9.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  # intl 由 flutter_localizations 钉在 0.20.2
  intl: ^0.20.2
  # clock 由 flutter_test 钉在 1.1.2，此处不要写更严格的下界
  clock: ^1.1.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # 代码生成
  # build_runner 2.17.1 要求 build ^5，而 drift_dev 2.35.x 要求 build <5，故钉 2.15.x（analyzer >=13.3 <15）
  build_runner: 2.15.1
  # drift_dev 2.34.x 用 analyzer ^13；2.35.x 要 analyzer >=13 <15，与 freezed 3.2.x 冲突
  drift_dev: ^2.34.0
  # freezed 4.x 要求 sdk >=3.13（=Flutter 3.47）；此处用 3.2.x 线
  freezed: ^3.2.5
  json_serializable: ^6.15.2

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# ---------------------------------------------------------------------------
# 本机（本沙箱）专用：无法访问 github.com 下载 sqlite3 预编译库，
# 因此改用系统 libsqlite3。移动端构建不需要这段，可整段删除。
# ---------------------------------------------------------------------------
hooks:
  user_defines:
    sqlite3:
      source: system
