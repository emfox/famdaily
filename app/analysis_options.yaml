# Famdaily 代码规范
#
# 关键约束（见 docs/tech-stack.zh_CN.md §8 决策 4）：
#   lib/domain/** 必须是纯 Dart，禁止 import 'package:flutter/...'
#   这条靠 CI 的 grep 兜底，因为 analyzer 无法表达"目录级 import 白名单"。

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    # 对「私有字段 + 公开具名参数」是误报：this._db 会把下划线名字变成参数名，
    # 我们宁可多写一次赋值。
    prefer_initializing_formals: false
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    prefer_single_quotes: true
    require_trailing_commas: true
    sort_child_properties_last: true
    unawaited_futures: true
