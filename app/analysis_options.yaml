# Famdaily 代码规范
#
# 关键约束（见 docs/tech-stack.zh_CN.md §8 决策 4）：
#   lib/domain/** 必须是纯 Dart，禁止 import 'package:flutter/...'
#   这条靠 CI 的 grep 兜底，因为 analyzer 无法表达"目录级 import 白名单"。

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - unawaited_futures
